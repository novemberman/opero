# Development infrastructure only.
# PostgreSQL, Redis, and ClamAV publish on 127.0.0.1. They are not reachable from the public network.
# Object storage defaults to a private filesystem root (.data/object-storage) because MinIO images
# were unavailable or non-writable in this environment. S3ObjectStorage remains for managed S3.
# Credentials come from the gitignored .env file. See .env.example.

name: opero

services:
  postgres:
    image: postgres:17-alpine
    container_name: opero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    container_name: opero-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:1.4
    container_name: opero-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLAMAV_PORT:?CLAMAV_PORT is required}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s
    security_opt:
      - no-new-privileges:true

  # Optional local S3-compatible store for Phase 7B-1 adapter tests.
  # Start with: docker compose --profile s3 up -d minio
  # External managed storage provisioning remains owner-gated for Railway.
  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: opero-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-opero_minio_key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-opero_minio_secret_change_me}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: opero_postgres_data
  redis_data:
    name: opero_redis_data
  clamav_data:
    name: opero_clamav_data
  minio_data:
    name: opero_minio_data
